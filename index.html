<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Catalog Mobilă AR</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  
    <!-- Bara de sus -->
    <header class="top-bar">
      <div class="header-left">
        <button class="icon-btn" onclick="openMenu()">☰</button>
      </div>
    
      <div class="header-center">
        <input type="text" id="searchInput" placeholder="Caută produse...">
      </div>
    
      <div class="header-right">
        <button class="icon-btn" onclick="toggleProfileMenu()">👤</button>
        <div id="profileMenu" class="profile-dropdown"></div> <!-- Schimbă clasa aici -->
      </div>
    </header>

    <!-- Popup Login/Register -->
    <div id="loginPopup" class="popup-overlay">
      <div class="popup-content" id="popupContent">
        <h2 id="popupTitle">Autentificare</h2>
    
        <input type="email" id="loginEmail" placeholder="Email" required />
        <input type="password" id="loginPassword" placeholder="Parolă" required />
    
        <button id="loginButton" onclick="login()">Logare</button>
        
        <p id="toggleText">Nu ai cont? <a href="#" onclick="showRegister()">Înregistrează-te aici</a></p>
    
        <button onclick="closeLoginPopup()" class="close-btn">Închide</button>
      </div>
    </div>

    
    <!-- Meniul lateral -->
    <div id="sideMenu" class="side-menu">
      <button class="close-btn" onclick="closeMenu()">×</button>
      <a href="index.html">Home</a>
      <a href="library.html">Library</a>
      <a href="about.html">About</a>
    </div>

  <main class="product-grid">
    <!-- Scaun -->
    <div class="product-card">
      <img src="assets/chair.jpg" alt="Scaun confortabil">
      <h2>Scaun</h2>
      <a href="product.html?model=chair.glb">Vezi în AR</a>
    </div>

    <!-- Canapea -->
    <div class="product-card">
      <img src="assets/sofa.jpg" alt="Canapea modernă">
      <h2>Canapea</h2>
      <a href="product.html?model=sofa.glb">Vezi în AR</a>
    </div>

    <!-- Dulap de cărți -->
    <div class="product-card">
      <img src="assets/wardrobe.jpg" alt="Dulap de cărți">
      <h2>Dulap de Cărți</h2>
      <a href="product.html?model=wardrobe.glb">Vezi în AR</a>
    </div>
  </main>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
  
  <!-- Scriptul tău -->
  <script src="script.js"></script>

</body>
</html>
