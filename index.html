<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Catalog Mobilă AR</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Bara de sus -->
  <header class="top-bar">
    <div class="header-left">
      <button class="icon-btn" onclick="openMenu()">☰</button>
    </div>
    <div class="header-center">
      <input type="text" id="searchInput" placeholder="Caută produse...">
    </div>
    <div class="header-right">
      <button class="icon-btn" onclick="toggleProfileMenu()">👤</button>
      <div id="profileMenu" class="profile-dropdown"></div>
    </div>
  </header>

  <!-- Popup Login/Register -->
  <div id="loginPopup" class="popup-overlay">
    <div class="popup-content" id="popupContent">
      <span class="close-button" onclick="closeLoginPopup()">&times;</span>
      <h2 id="popupTitle">Autentificare</h2>

      <input type="text" id="displayName" placeholder="Nume complet" style="display: none;" />
      <input type="tel" id="phoneNumber" placeholder="Telefon" style="display: none;" />
      <input type="text" id="photoURL" placeholder="URL poză profil (opțional)" style="display: none;" />

      <input type="email" id="loginEmail" placeholder="Email" required />
      <input type="password" id="loginPassword" placeholder="Parolă" required />

      <button id="loginButton" onclick="login()">Logare</button>

      <p id="toggleText">Nu ai cont? <a href="#" onclick="showRegister()">Înregistrează-te aici</a></p>
    </div>
  </div>

  <!-- Meniul lateral -->
  <div id="sideMenu" class="side-menu">
    <button class="close-btn" onclick="closeMenu()">×</button>
    <a href="index.html">Home</a>
    <a href="library.html">Library</a>
    <a href="about.html">About</a>
  </div>

  <!-- Lista de produse -->
 <main class="product-grid">
  <div class="product-card">
    <img src="assets/Chair1.jpg" alt="Scaun Modern">
    <h2>Scaun Vintage</h2>
    <a href="product.html?model=Chair1.glb">Vezi în AR</a>
    <button class="favorite-btn" onclick="addToFavorites({ id: 'Chair1', name: 'Scaun Modern', image: 'assets/Chair1.jpg' })">Adaugă la favorite</button>
  </div>

  <div class="product-card">
    <img src="assets/Chair2.jpg" alt="Scaun Confortabil">
    <h2>Scaun Bucatarie</h2>
    <a href="product.html?model=Chair2.glb">Vezi în AR</a>
    <button class="favorite-btn" onclick="addToFavorites({ id: 'Chair2', name: 'Scaun Confortabil', image: 'assets/Chair2.jpg' })">Adaugă la favorite</button>
  </div>

  <div class="product-card">
    <img src="assets/Chair3.jpg" alt="Scaun Alb">
    <h2>Scaun Gradina</h2>
    <a href="product.html?model=Chair3.glb">Vezi în AR</a>
    <button class="favorite-btn" onclick="addToFavorites({ id: 'Chair3', name: 'Scaun Alb', image: 'assets/Chair3.jpg' })">Adaugă la favorite</button>
  </div>

  <div class="product-card">
    <img src="assets/canape.jpg" alt="Canapea modernă">
    <h2>Canapea Modern</h2>
    <a href="product.html?model=canape.glb">Vezi în AR</a>
    <button class="favorite-btn" onclick="addToFavorites({ id: 'canape', name: 'Canapea modernă', image: 'assets/canape.jpg' })">Adaugă la favorite</button>
  </div>

  <div class="product-card">
    <img src="assets/shelves.jpg" alt="Dulap de cărți">
    <h2>Dulap de Cărți</h2>
    <a href="product.html?model=shelves.glb">Vezi în AR</a>
    <button class="favorite-btn" onclick="addToFavorites({ id: 'shelves', name: 'Dulap de Cărți', image: 'assets/shelves.jpg' })">Adaugă la favorite</button>
  </div>

  <div class="product-card">
    <img src="assets/table1.jpg" alt="Masă modernă">
    <h2>Masă mica</h2>
    <a href="product.html?model=table1.glb">Vezi în AR</a>
    <button class="favorite-btn" onclick="addToFavorites({ id: 'table1', name: 'Masă Modernă', image: 'assets/table1.jpg' })">Adaugă la favorite</button>
  </div>

  <div class="product-card">
    <img src="assets/table2.jpg" alt="Dulap de cărți">
    <h2>Masa lunga</h2>
    <a href="product.html?model=table2.glb">Vezi în AR</a>
    <button class="favorite-btn" onclick="addToFavorites({ id: 'table2', name: 'Dulap de Cărți', image: 'assets/table2.jpg' })">Adaugă la favorite</button>
  </div>
</main>
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
  <script src="script.js"></script>
</body>
</html>
