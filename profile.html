<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profilul Meu</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Bara de sus -->
  <header class="top-bar">
    <div class="header-left">
      <button class="icon-btn" onclick="openMenu()">☰</button>
    </div>
    <div class="header-right">
      <button class="icon-btn" onclick="toggleProfileMenu()">👤</button>
      <div id="profileMenu" class="profile-dropdown"></div>
    </div>
  </header>

  <!-- Meniul lateral -->
  <div id="sideMenu" class="side-menu">
    <button class="close-btn" onclick="closeMenu()">×</button>
    <a href="index.html">Home</a>
    <a href="library.html">Library</a>
    <a href="about.html">About</a>
  </div>

  <!-- Profilul utilizatorului -->
  <main class="profile-container">
    <h1>Profilul Meu</h1>
    <div class="profile-info">
      <div class="profile-details">
        <h2 id="userName">Nume</h2>
        <p><strong>Email:</strong> <span id="userEmail"></span></p>
        <p><strong>Telefon:</strong> <span id="userPhone"></span></p>
        <button class="edit-btn" onclick="logout()">Deconectare</button>
      </div>
    </div>
  </main>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
  <script src="script.js"></script>
</body>
</html>
