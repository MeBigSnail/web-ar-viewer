<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vizualizare produs</title>
  <link rel="stylesheet" href="style.css" />
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
</head>
<body>
  <header>
    <h1>Vizualizare produs în AR</h1>
  </header>

  <main>
    
<model-viewer
  id="viewer"
  src="models/Chair1.glb"
  ar
  ar-scale="fixed"
  ar-modes="scene-viewer quick-look webxr"
  camera-controls
  auto-rotate
  reveal="interaction" <!-- 🔁 așteaptă interacțiune -->
  loading="lazy"
  alt="Model 3D de mobilier"
  style="background-color: #f0f0f0; width: 100%; height: 500px;">
  
  <!-- Loader personalizat -->
  <div class="progress-bar" slot="progress-bar">
    <div class="update-bar"></div>
  </div>
</model-viewer>


    <div class="controls">
      <!-- Exemplu: selector culoare viitor -->
    </div>

    <a href="index.html" class="back-button">Înapoi la Catalog</a>
  </main>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const modelName = urlParams.get('model');

    const viewer = document.getElementById('viewer');
    viewer.src = `models/${modelName}`;
  </script>
  
</body>
</html>
